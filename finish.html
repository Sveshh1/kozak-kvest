<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Фінал — Фестиваль городового козацтва</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 20%, #382719 0%, #17100c 45%, #0d0907 100%);
  color: #f5ead7;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.container {
  width: 100%;
  max-width: 560px;
  text-align: center;
}

.symbol {
  font-size: 42px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.25;
  letter-spacing: 2px;
  font-weight: 800;
}

.subtitle {
  margin-top: 10px;
  color: #cbbda9;
  font-size: 16px;
}

.card {
  margin-top: 45px;
  padding: 38px 32px;
  border: 1px solid #70583a;
  border-radius: 24px;
  background: rgba(55, 42, 31, 0.72);
  box-shadow: 0 20px 70px rgba(0,0,0,0.45);
}

.hidden {
  display: none !important;
}

.protocol {
  font-size: 15px;
  letter-spacing: 3px;
  color: #d9b36b;
  margin-bottom: 28px;
}

.text {
  font-size: 18px;
  line-height: 1.6;
  color: #eadfce;
}

.big-text {
  margin: 25px 0;
  font-size: 21px;
  line-height: 1.6;
  font-weight: 700;
}

.field {
  text-align: left;
  margin-top: 22px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  color: #cbbda9;
  font-size: 14px;
  letter-spacing: 0.5px;
}

.input {
  width: 100%;
  padding: 16px;
  border-radius: 13px;
  border: 1px solid #806440;
  background: #1a120d;
  color: #f4d38e;
  font-size: 18px;
  outline: none;
}

.input:focus {
  border-color: #d5a855;
  box-shadow: 0 0 0 2px rgba(213,168,85,0.15);
}

.code-input {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 8px;
}

.time-input {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}

.button {
  width: 100%;
  margin-top: 28px;
  padding: 17px;
  border: 1px solid #a47b3d;
  border-radius: 13px;
  background: #332416;
  color: #e7bd6d;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: 0.2s;
}

.button:hover {
  background: #45301c;
  border-color: #d2a454;
}

.button:active {
  transform: scale(0.98);
}

.checking-title {
  color: #e7bd6d;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
}

.loader {
  margin: 30px 0 15px;
  height: 7px;
  background: #1a120d;
  border-radius: 10px;
  overflow: hidden;
}

.loader-bar {
  width: 0%;
  height: 100%;
  background: #d5a855;
  transition: width 0.08s linear;
}

.progress {
  font-family: monospace;
  color: #d5a855;
  font-size: 15px;
  letter-spacing: 1px;
}

.result-symbol {
  font-size: 55px;
  margin-bottom: 15px;
}

.result-title {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #e7bd6d;
}

.result-text {
  margin-top: 18px;
  font-size: 18px;
  line-height: 1.7;
  color: #e8dccb;
}

.result-data {
  margin-top: 25px;
  padding: 18px;
  border: 1px solid #6e5639;
  border-radius: 15px;
  background: rgba(20, 13, 9, 0.45);
  text-align: left;
}

.result-row {
  padding: 9px 0;
  border-bottom: 1px solid rgba(130,100,65,0.3);
}

.result-row:last-child {
  border-bottom: none;
}

.result-label {
  color: #9e8b75;
  font-size: 13px;
  margin-bottom: 3px;
}

.result-value {
  color: #f1d18d;
  font-size: 18px;
  font-weight: 700;
}

.retry {
  margin-top: 25px;
}

.footer {
  margin-top: 22px;
  font-size: 12px;
  color: #756758;
  letter-spacing: 1px;
}

@media (max-width: 600px) {

  body {
    padding: 18px;
  }

  h1 {
    font-size: 23px;
  }

  .card {
    margin-top: 35px;
    padding: 30px 22px;
  }

  .big-text {
    font-size: 19px;
  }

  .code-input {
    font-size: 24px;
    letter-spacing: 6px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="symbol">⚔️</div>

  <h1>
    ФЕСТИВАЛЬ ГОРОДОВОГО<br>
    КОЗАЦТВА
  </h1>

  <div class="subtitle">
    цифровий квест
  </div>


  <!-- ФІНАЛЬНА ФОРМА -->

  <div class="card" id="startScreen">

    <div class="protocol">
      ◈ ФІНАЛЬНИЙ ПРОТОКОЛ ◈
    </div>

    <div class="text">
      Ви пройшли всі випробування.
    </div>

    <div class="big-text">
      7 випробувань.<br>
      7 цифр.<br>
      1 код.
    </div>


    <!-- НАЗВА КОМАНДИ -->

    <div class="field">

      <label for="teamInput">
        Назва команди
      </label>

      <input
        id="teamInput"
        class="input"
        type="text"
        placeholder="Введіть назву команди"
        autocomplete="off"
      >

    </div>


    <!-- ФІНАЛЬНИЙ КОД -->

    <div class="field">

      <label for="codeInput">
        Фінальний код
      </label>

      <input
        id="codeInput"
        class="input code-input"
        type="tel"
        inputmode="numeric"
        maxlength="7"
        placeholder="_______"
        autocomplete="off"
      >

    </div>


    <!-- ЧАС -->

    <div class="field">

      <label for="timeInput">
        Час фінішу
      </label>

      <input
        id="timeInput"
        class="input time-input"
        type="time"
      >

    </div>


    <button
      id="activateButton"
      class="button"
    >
      ЗАВЕРШИТИ КВЕСТ
    </button>

  </div>


  <!-- ПЕРЕВІРКА -->

  <div class="card hidden" id="checkingScreen">

    <div class="protocol">
      ◈ ФІНАЛЬНИЙ ПРОТОКОЛ ◈
    </div>

    <div class="checking-title">
      ПЕРЕВІРКА КОДУ…
    </div>

    <div class="loader">
      <div
        class="loader-bar"
        id="loaderBar">
      </div>
    </div>

    <div
      class="progress"
      id="progress">
      ░░░░░░░░░░░░ 0%
    </div>

    <div
      class="text"
      id="checkingMessage"
      style="margin-top:25px;">
      Аналіз фінального коду…
    </div>

  </div>


  <!-- РЕЗУЛЬТАТ -->

  <div class="card hidden" id="resultScreen">

    <div
      class="result-symbol"
      id="resultSymbol">
      ◈
    </div>

    <div
      class="result-title"
      id="resultTitle">
      КВЕСТ ЗАВЕРШЕНО
    </div>

    <div
      class="result-text"
      id="resultText">
    </div>

    <div
      class="result-data hidden"
      id="resultData">

      <div class="result-row">

        <div class="result-label">
          КОМАНДА
        </div>

        <div
          class="result-value"
          id="resultTeam">
        </div>

      </div>


      <div class="result-row">

        <div class="result-label">
          ФІНАЛЬНИЙ КОД
        </div>

        <div
          class="result-value"
          id="resultCode">
        </div>

      </div>


      <div class="result-row">

        <div class="result-label">
          ЧАС ФІНІШУ
        </div>

        <div
          class="result-value"
          id="resultTime">
        </div>

      </div>

    </div>


    <button
      class="button retry hidden"
      id="retryButton">
      СПРОБУВАТИ ЩЕ РАЗ
    </button>

  </div>


  <div class="footer">
    ФІНАЛЬНА СТАНЦІЯ
  </div>

</div>


<script>

/* =========================================
   ЄДИНИЙ ФІНАЛЬНИЙ КОД
========================================= */

const FINAL_CODE = "0110149";


/* =========================================
   ЕЛЕМЕНТИ
========================================= */

const startScreen =
  document.getElementById("startScreen");

const checkingScreen =
  document.getElementById("checkingScreen");

const resultScreen =
  document.getElementById("resultScreen");

const teamInput =
  document.getElementById("teamInput");

const codeInput =
  document.getElementById("codeInput");

const timeInput =
  document.getElementById("timeInput");

const activateButton =
  document.getElementById("activateButton");

const loaderBar =
  document.getElementById("loaderBar");

const progress =
  document.getElementById("progress");

const checkingMessage =
  document.getElementById("checkingMessage");

const resultSymbol =
  document.getElementById("resultSymbol");

const resultTitle =
  document.getElementById("resultTitle");

const resultText =
  document.getElementById("resultText");

const resultData =
  document.getElementById("resultData");

const resultTeam =
  document.getElementById("resultTeam");

const resultCode =
  document.getElementById("resultCode");

const resultTime =
  document.getElementById("resultTime");

const retryButton =
  document.getElementById("retryButton");


/* =========================================
   ТІЛЬКИ ЦИФРИ В ПОЛІ КОДУ
========================================= */

codeInput.addEventListener(
  "input",
  function() {

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 7);

  }
);


/* =========================================
   КНОПКА
========================================= */

activateButton.addEventListener(
  "click",
  startVerification
);


/* =========================================
   ПЕРЕВІРКА ПОЛІВ
========================================= */

function startVerification() {

  const team =
    teamInput.value.trim();

  const code =
    codeInput.value.trim();

  const time =
    timeInput.value;


  if (!team) {

    alert(
      "Введіть назву команди."
    );

    teamInput.focus();

    return;
  }


  if (code.length !== 7) {

    alert(
      "Введіть фінальний код із 7 цифр."
    );

    codeInput.focus();

    return;
  }


  if (!time) {

    alert(
      "Введіть час фінішу."
    );

    timeInput.focus();

    return;
  }


  startScreen.classList.add(
    "hidden"
  );

  checkingScreen.classList.remove(
    "hidden"
  );


  animateChecking(
    team,
    code,
    time
  );

}


/* =========================================
   АНІМАЦІЯ
========================================= */

function animateChecking(
  team,
  code,
  time
) {

  let value = 0;


  const interval =
    setInterval(function() {

      value += 4;


      if (value >= 100) {

        value = 100;

        clearInterval(interval);

        loaderBar.style.width =
          "100%";

        progress.textContent =
          "████████████ 100%";

        checkingMessage.textContent =
          "Формування вердикту…";


        setTimeout(function() {

          checkCode(
            team,
            code,
            time
          );

        }, 500);

        return;
      }


      loaderBar.style.width =
        value + "%";


      const blocks =
        Math.floor(value / 8);

      const empty =
        12 - blocks;


      progress.textContent =
        "█".repeat(blocks) +
        "░".repeat(empty) +
        " " +
        value +
        "%";


      if (value < 35) {

        checkingMessage.textContent =
          "Аналіз фінального коду…";

      } else if (value < 70) {

        checkingMessage.textContent =
          "Перевірка відповідності…";

      } else {

        checkingMessage.textContent =
          "Формування вердикту…";

      }

    }, 55);

}


/* =========================================
   ПЕРЕВІРКА КОДУ
========================================= */

function checkCode(
  team,
  code,
  time
) {

  checkingScreen.classList.add(
    "hidden"
  );

  resultScreen.classList.remove(
    "hidden"
  );


  if (code === FINAL_CODE) {


    /* ПРАВИЛЬНИЙ КОД */

    resultSymbol.textContent =
      "⚔️";

    resultTitle.textContent =
      "КВЕСТ ЗАВЕРШЕНО";


    resultText.innerHTML =
      "Ви успішно пройшли всі випробування.<br><br>" +
      "<strong>Вітаємо, козацька командо!</strong>";


    resultTeam.textContent =
      team;

    resultCode.textContent =
      code;

    resultTime.textContent =
      time;

    resultData.classList.remove(
      "hidden"
    );

    retryButton.classList.add(
      "hidden"
    );


  } else {


    /* НЕПРАВИЛЬНИЙ КОД */

    resultSymbol.textContent =
      "×";

    resultTitle.textContent =
      "КОД НЕПРАВИЛЬНИЙ";


    resultText.textContent =
      "Перевірте 7 цифр, які ви зібрали під час випробувань.";


    resultData.classList.add(
      "hidden"
    );


    retryButton.classList.remove(
      "hidden"
    );

  }

}


/* =========================================
   ПОВТОРНА СПРОБА
========================================= */

retryButton.addEventListener(
  "click",
  function() {

    resultScreen.classList.add(
      "hidden"
    );

    startScreen.classList.remove(
      "hidden"
    );


    codeInput.value = "";

    loaderBar.style.width =
      "0%";

    progress.textContent =
      "░░░░░░░░░░░░ 0%";

    checkingMessage.textContent =
      "Аналіз фінального коду…";

  }
);

</script>

</body>
</html>
